services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      CACHE_PATH: /app/.cache/elexon.sqlite3
      CACHE_TTL_SECONDS: "3600"
    volumes:
      - elexon-cache:/app/.cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 3
      start_period: 10s
  dashboard:
    build: ./dashboard
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  elexon-cache:
